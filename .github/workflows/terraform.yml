name: Terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token:      write  # OIDC token
  contents:      read
  pull-requests: write  # post plan as PR comment

env:
  TF_VERSION: "1.10.0"
  AWS_REGION:  eu-west-1

jobs:
  terraform:
    name: ${{ github.event_name == 'push' && 'Plan + Apply' || 'Plan' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── Static checks ────────────────────────────────────────────────────────

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=pdf-tools/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Validate
        run: terraform validate

      # ── Plan ─────────────────────────────────────────────────────────────────

      - name: Plan
        id: plan
        run: |
          terraform plan \
            -var="github_repo=${{ github.repository }}" \
            -out=plan.tfplan \
            -no-color \
            2>&1 | tee plan.txt
        # continue so we can post the plan output even when there are changes
        continue-on-error: true

      # Post the plan as a collapsible PR comment (PRs only)
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const raw  = fs.readFileSync('terraform/plan.txt', 'utf8');
            const plan = raw.length > 60000
              ? raw.slice(0, 60000) + '\n\n…truncated, see workflow logs for the full output'
              : raw;

            const outcome = '${{ steps.plan.outcome }}';
            const status  = outcome === 'success' ? '✅ Plan succeeded' : '❌ Plan failed';

            const body = [
              '## Terraform Plan',
              status,
              '',
              '<details><summary>Show plan output</summary>',
              '',
              '```',
              plan,
              '```',
              '',
              '</details>',
              '',
              `_Workflow: [${context.workflow} #${context.runNumber}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})_`,
            ].join('\n');

            // Replace any previous plan comment to keep the PR clean
            const comments = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments.data) {
              if (c.body.startsWith('## Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # ── Apply (main branch only) ──────────────────────────────────────────────

      - name: Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve plan.tfplan
